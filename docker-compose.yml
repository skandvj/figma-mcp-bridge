services:
  mcp-server:
    build: .
    ports:
      - "3100:3100"
    environment:
      MCP_TRANSPORT: sse
      MCP_PORT: "3100"
      FIGMA_MODE: ${FIGMA_MODE:-demo}
      FIGMA_FILES_CONFIG: ${FIGMA_FILES_CONFIG:-figma.files.json}
      FIGMA_PRODUCT: ${FIGMA_PRODUCT:-web-app}
      FIGMA_CACHE_PATH: /tmp/figma-cache.sqlite
      FIGMA_ACCESS_TOKEN: ${FIGMA_ACCESS_TOKEN:-}
      FIGMA_FILE_KEY: ${FIGMA_FILE_KEY:-}
      MCP_API_KEY: ${MCP_API_KEY:-}
      MCP_BASIC_AUTH_USERNAME: ${MCP_BASIC_AUTH_USERNAME:-}
      MCP_BASIC_AUTH_PASSWORD: ${MCP_BASIC_AUTH_PASSWORD:-}
      FIGMA_WEBHOOK_SECRET: ${FIGMA_WEBHOOK_SECRET:-}
      CODEGEN_CONFIG_PATH: ${CODEGEN_CONFIG_PATH:-codegen.config.json}
