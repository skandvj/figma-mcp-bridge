services:
  mcp-server:
    build: .
    ports:
      - "3100:3100"
    environment:
      MCP_TRANSPORT: sse
      MCP_PORT: "3100"
      FIGMA_CACHE_PATH: /tmp/figma-cache.sqlite
      FIGMA_ACCESS_TOKEN: ${FIGMA_ACCESS_TOKEN:-}
      FIGMA_FILE_KEY: ${FIGMA_FILE_KEY:-}
      FIGMA_MOCK_DATA: ${FIGMA_MOCK_DATA:-true}
